# Chạy test trên Ubuntu (gcc) và macOS (clang) cho mỗi pull request và mỗi lần push lên main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Chạy unit test
        run: make test CFLAGS="-std=c99 -Wall -Wextra -pedantic -O2 -Werror"

      - name: Kiểm tra code tham chiếu
        run: make -C tools check
